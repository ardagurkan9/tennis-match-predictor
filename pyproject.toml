[project]
name = "tennis-match-predictor"
version = "0.1.0"
description = "Leakage-aware ATP match prediction pipeline"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".claude", ".agents", "data", "models", "reports"]

[tool.ruff.lint]
# Start CI with correctness-oriented checks; style cleanup of the historical
# codebase can be tightened independently without blocking bug fixes.
select = ["E9", "F63", "F7", "F82"]
